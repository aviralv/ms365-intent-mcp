[project]
name = "ms365-intent-mcp"
version = "1.10.4"
description = "Intent-oriented MCP server for Microsoft 365"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aviral Vaid" }]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "msal>=1.28.0",
]

[project.optional-dependencies]
# Retained for backward compat: `...[auth]` still resolves. msal is now a
# base dependency (device-code auth must work on any install), so this is a
# no-op alias — installing the extra pulls nothing new.
auth = ["msal>=1.28.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/ms365_intent_mcp"]

[tool.hatch.build.targets.wheel]
packages = ["src/ms365_intent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[project.scripts]
ms365-intent-mcp = "ms365_intent_mcp.server:main"
